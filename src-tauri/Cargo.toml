[package]
name = "mint"
version = "0.1.0"
edition = "2021"
authors = ["Xarch Labs"]
description = "Mint — AI-Powered Edge Memory & Intelligence Platform (offline-first)"

[lib]
# The `_lib` suffix keeps the lib name distinct from the bin on Windows.
# https://github.com/rust-lang/cargo/issues/8519
name = "mint_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4.34"
base64 = "0.22"
mint-core = { path = "../crates/mint-core" }

# Dev builds: optimize every dependency (Qdrant Edge, ONNX Runtime bindings,
# BM25, PDF parsing, and mint-core itself) so retrieval and ingestion run near
# release speed during `npm run tauri dev`. Only the app crate stays unoptimized,
# so its incremental rebuilds remain fast. First build after this is slower.
[profile.dev.package."*"]
opt-level = 3

# Release optimization (see https://tauri.app/concept/size/#cargo-configuration).
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
